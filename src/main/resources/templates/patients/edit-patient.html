<!doctype html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>MediTrack - Betegek</title>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<form th:action="@{/patients/edit}" method="post" th:object="${patient}" class="row">

    <!-- ID -->
    <input type="hidden" th:field="*{id}"/>

    <!-- Név -->
    <div class="col-md-6 mb-3">
        <label class="form-label">Név</label>
        <input type="text" class="form-control" th:field="*{name}" placeholder="Teljes név">
    </div>

    <!-- Születési hely -->
    <div class="col-md-6 mb-3">
        <label class="form-label">Születési hely</label>
        <input type="text" class="form-control" th:field="*{birthPlace}" placeholder="Pl. Budapest">
    </div>

    <!-- Születési idő -->
    <div class="col-md-6 mb-3">
        <label class="form-label">Születési idő</label>
        <input type="date" class="form-control" th:field="*{birthDate}">
    </div>

    <!-- Anyja neve -->
    <div class="col-md-6 mb-3">
        <label class="form-label">Anyja neve</label>
        <input type="text" class="form-control" th:field="*{motherName}">
    </div>

    <!-- Lakcím -->
    <div class="col-12 mb-3">
        <label class="form-label">Lakcím</label>
        <input type="text" class="form-control" th:field="*{address}">
    </div>

    <!-- Diagnózis -->
    <div class="col-12 mb-3">
        <label class="form-label">Diagnózis</label>
        <textarea class="form-control" rows="3" th:field="*{diagnosis}"></textarea>
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-primary">Mentés</button>
    </div>

</form>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
